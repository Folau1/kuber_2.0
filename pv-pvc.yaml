
apiVersion: v1
kind: PersistentVolume
metadata:
  name: hw2-manual-pv
spec:
  capacity:
    storage: 1Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath:
    path: /var/lib/k8s-hw-2-1/pv-data
    type: Directory
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data-pvc
  namespace: hw-2-1
spec:
  storageClassName: ""
  volumeName: hw2-manual-pv
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-exchange-pvc
  namespace: hw-2-1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: data-exchange-pvc
  template:
    metadata:
      labels:
        app: data-exchange-pvc
    spec:
      nodeSelector:
        kubernetes.io/hostname: node2
      containers:
        - name: busybox
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
          args:
            - |
              while true; do
                date >> /shared/data.log
                sleep 5
              done
          volumeMounts:
            - name: persistent-storage
              mountPath: /shared

        - name: multitool
          image: wbitt/network-multitool
          volumeMounts:
            - name: persistent-storage
              mountPath: /shared

      volumes:
        - name: persistent-storage
          persistentVolumeClaim:
            claimName: data-pvc
