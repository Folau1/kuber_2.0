
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: hw2-local-sc
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: hw2-local-pv
spec:
  capacity:
    storage: 1Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: hw2-local-sc
  local:
    path: /var/lib/k8s-hw-2-1/sc-data
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - node2
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sc-data-pvc
  namespace: hw-2-1
spec:
  storageClassName: hw2-local-sc
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-exchange-sc
  namespace: hw-2-1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: data-exchange-sc
  template:
    metadata:
      labels:
        app: data-exchange-sc
    spec:
      containers:
        - name: busybox
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
          args:
            - |
              while true; do
                date >> /shared/data.log
                sleep 5
              done
          volumeMounts:
            - name: sc-storage
              mountPath: /shared

        - name: multitool
          image: wbitt/network-multitool
          volumeMounts:
            - name: sc-storage
              mountPath: /shared

      volumes:
        - name: sc-storage
          persistentVolumeClaim:
            claimName: sc-data-pvc
